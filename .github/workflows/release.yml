name: Release

# Builds the installers for a tagged version and attaches them to a draft
# GitHub release, which the maintainer reviews and publishes.
#
# Auto-update is not wired up yet: it needs a signing key pair whose private
# half lives in repository secrets (TAURI_SIGNING_PRIVATE_KEY) and whose public
# half goes in tauri.conf.json, plus the `updater` bundle target and the
# tauri-plugin-updater dependency. Until then updates are manual downloads.
# See ROADMAP.md.

on:
  push:
    tags: ["v*"]
  # Lets a release be rehearsed from a branch without tagging first.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple silicon)
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - os: macos-latest
            label: macOS (Intel)
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            label: Linux
            args: ""
            target: ""
          - os: windows-latest
            label: Windows
            args: ""
            target: ""
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # The bundles are unsigned. macOS will refuse to open the .dmg without
      # right-click → Open, and Windows SmartScreen will warn, until code
      # signing certificates are added as secrets.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-dev', github.run_number) }}
          releaseName: ForgeSF ${{ github.ref_type == 'tag' && github.ref_name || 'dev build' }}
          releaseBody: |
            Install the build for your platform below.

            ForgeSF drives the Salesforce CLI, so `sf` must be installed and on
            your PATH: https://developer.salesforce.com/tools/salesforcecli

            See CHANGELOG.md for what changed.
          releaseDraft: true
          prerelease: ${{ github.ref_type != 'tag' }}
          args: ${{ matrix.args }}
