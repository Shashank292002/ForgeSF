name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (type-check, lint, test) · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary development platform; it also exercises
        # path handling that Linux-only CI never saw.
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p tsconfig.app.json
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm format:check

  backend:
    name: Backend (cargo) · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The CLI runner has Windows-only code (sf.cmd discovery, console
        # suppression, process-tree kill) that only a Windows runner compiles
        # and tests.
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Tauri's Linux build needs the system webkit/gtk headers.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo check
      - run: cargo test --lib

      # `cargo test --lib` regenerates the TypeScript IPC types via ts-rs.
      # If that changes anything, the committed bindings are stale and the
      # frontend's `invoke<T>` calls no longer match what Rust sends.
      - name: Generated IPC types are up to date
        run: git diff --exit-code -- ../src/types/generated

  # The checks above all run against source. This one proves the thing people
  # actually install still builds and starts: a release build links the Rust
  # side against the bundled frontend, which is where CSP, asset paths and
  # plugin setup break without any test noticing.
  build:
    name: Release build & smoke test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xvfb

      - name: Install dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # `--no-bundle` stops before building installers: those are the release
      # workflow's job, and take far longer than the compile this is checking.
      - name: Build
        working-directory: apps/desktop
        run: pnpm tauri build --no-bundle

      # Starts the built app and gives it twenty seconds to fall over. It
      # catches what a unit test cannot: a CSP that blocks the app's own
      # scripts, a missing bundled asset, a plugin that panics during setup.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/desktop/src-tauri/target/release
        run: |
          set +e
          xvfb-run -a timeout 20s ./forgesf
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "The app exited on its own with code $code — it should still be running."
            exit 1
          fi
          echo "Still running after 20s."

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop/src-tauri/target/release
        shell: pwsh
        run: |
          $app = Start-Process -FilePath .\forgesf.exe -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) {
            Write-Host "The app exited on its own with code $($app.ExitCode) — it should still be running."
            exit 1
          }
          Stop-Process -Id $app.Id -Force
          Write-Host "Still running after 20s."
